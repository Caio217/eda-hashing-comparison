plugins {
    id 'java'
}

group = 'eda'
version = '1.0-SNAPSHOT'

repositories {
    mavenCentral() 
}

dependencies {
    implementation 'org.openjdk.jmh:jmh-core:1.37'
    
    annotationProcessor 'org.openjdk.jmh:jmh-generator-annprocess:1.37'
}


java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}
