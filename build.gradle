plugins {
    id 'java'
    id 'application'
}

group = 'eda'
version = '1.0-SNAPSHOT'

repositories {
    mavenCentral() 
}

dependencies {
    implementation 'org.openjdk.jmh:jmh-core:1.37'
    
    annotationProcessor 'org.openjdk.jmh:jmh-generator-annprocess:1.37'
}

application {
    // ATENÇÃO AQUI: Se a sua classe MainBenchmark estiver dentro de alguma pasta 
    // (ex: package benchmark;), coloque 'benchmark.MainBenchmark'.
    // Se não tiver "package" no topo do seu .java, coloque apenas 'MainBenchmark'.
    mainClass = 'benchmark.MainBenchmark' 
}


java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}
