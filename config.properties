# ==========================================
# CONFIGURACOES DO EXPERIMENTO - GRUPO 6
# ==========================================

# Qual tipo de dado testar? (INT ou STR)
tipoDado=int

# Quais funcoes testar? (DIVISAO, MULTIPLICACAO, POLINOMIAL, MID-SQUARE e DJB2)
# Pode colocar mais de uma separada por virgula!
tipoHash=MULTIPLICACAO

# Parametros do JMH (Tamanho do dataset(10000, 100000, 1000000) e fator de carga(0.5, 0.75, 0.9))
# Pode colocar mais de uma separada por virgula!
n=10000
fatorCarga=0.75

# Quantidade de digitos das chaves numericas quando tipoDado=INT (6, 7 ou 9 digitos)
# Pode colocar mais de uma separada por virgula!
tamanhoInt=6

# Quantidade de Caracteres das chaves de texto quando tipoDado=STR (10, 50 ou 100 caracteres)
# Pode colocar mais de uma separada por virgula!
tamanhoStr=10

# Cenario de geracao quando tipoDado=STR (UNIFORME,PADRAO ou ANAGRAMAS)
# Pode colocar mais de uma separada por virgula!
cenarioDados=UNIFORME

# Comando para rodar o BenchMark(OBS: Precisa ser na raiz do Projeto):
#   ./gerarDados.sh  #(para gerar os arquivos de entrada ou sobrescrever os antigos, se já tem rode apenas o comando abaixo)
